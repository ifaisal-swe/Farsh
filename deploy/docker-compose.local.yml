# The full backend on one PC: PostgreSQL + app at http://localhost:8790 (no public ports, no domain).
#   cd deploy && sh setup.sh && docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  caddy:
    profiles: ["public"]
  app:
    ports: ["127.0.0.1:8790:8080"]
    environment:
      APP_BASE_URL: http://localhost:8790
      SAAS_PUBLIC_DATA: everyone # keyless prices, personal use on this PC only
